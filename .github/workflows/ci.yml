name: CI — local generator verification
on:
  pull_request:
  workflow_call:
  push:
    branches: [feat/local-first-video-prompt-generator, 'fix/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: video-prompts-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Node 24 checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:pages
      - run: npm audit
      - name: Optional static review artifact (no deployment)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: static-pwa-review
          path: |
            dist/
            dist-pages/
          if-no-files-found: error
          retention-days: 3
  browsers:
    name: Chromium, Firefox and WebKit acceptance
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run build:pages
      - run: npm run test:e2e
        env:
          DEBUG: pw:browser
          GST_DEBUG: '2'
      - name: Independent WebKit QC stress (no retries)
        if: always()
        run: npx playwright test --project=webkit --grep 'QC replacement|rapid native QC selections' --repeat-each=10 --workers=1 --output=test-results/qc-stress
        env:
          DEBUG: pw:browser
          GST_DEBUG: '2'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-qc-stress-report
      - name: Optional browser report artifact
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: browser-acceptance-report
          path: |
            playwright-report/
            playwright-qc-stress-report/
            test-results/
          if-no-files-found: error
          retention-days: 3
